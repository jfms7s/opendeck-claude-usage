[package]
name = "opendeck-claude-usage"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "OpenDeck plugin: Claude session/weekly/monthly usage on a dial's touch strip or a keypad tile"
repository = "https://github.com/jfms7s/opendeck-claude-usage"

[dependencies]
openaction = "2.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
