name: Release
# Replaces the in-repo release jobs build-macos, build, publish.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    # The called workflow's own jobs ask for exactly what they need; only its
    # `publish` job gets the write permissions.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: jfms7s/opendeck-plugin-ci/.github/workflows/release.yml@b9bf0819298f7b391f25e7dec1a959f8390e7ae0 # v0.1.1
    with:
      pi-tests: "tests/pi/*.test.mjs"
      macos-test: true
      check-macos: "scripts/check-macos-bin.sh {bin}"
      aarch64-linux: true
