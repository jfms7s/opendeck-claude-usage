name: Release
# Pushing a `vX.Y.Z` tag builds, tests and packages that commit, then
# creates the GitHub release as a draft, attaches the bundle and its
# checksum, and only then publishes it - so a release is never visible
# without its asset.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # Read-only: this job runs every dependency's build script and proc
    # macro, so it gets no token that can write anything.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml and manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          manifest_version=$(jq -r .Version assets/manifest.json)
          echo "tag=$tag Cargo.toml=$cargo_version manifest.json=$manifest_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$manifest_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) / manifest.json ($manifest_version)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      # Nothing runs the aarch64 binary; at least check it is one.
      - name: Check each binary's architecture
        run: |
          file target/x86_64-unknown-linux-gnu/release/opendeck-claude-usage | grep -q 'x86-64'
          file target/aarch64-unknown-linux-gnu/release/opendeck-claude-usage | grep -q 'ARM aarch64'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test tests/
      # --all: every target in the manifest's CodePaths must be bundled.
      - run: node build.mjs --all
      - name: Zip the plugin bundle and checksum it
        run: |
          cd dist
          zip -r ../opendeck-claude-usage.streamDeckPlugin com.jfms7s.claudeusage.sdPlugin
          cd ..
          sha256sum opendeck-claude-usage.streamDeckPlugin > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            opendeck-claude-usage.streamDeckPlugin
            SHA256SUMS
          if-no-files-found: error

  publish:
    # The only job with write access: it runs no project or dependency
    # code, just attests and attaches what `build` produced.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
      - run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: opendeck-claude-usage.streamDeckPlugin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            opendeck-claude-usage.streamDeckPlugin
            SHA256SUMS
      - name: Publish the release now that its assets are attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
