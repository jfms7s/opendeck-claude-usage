name: Release
# Pushing a `vX.Y.Z` tag builds, tests and packages that commit (Linux
# binaries on Ubuntu, the macOS one on a macOS runner, each tested on its
# own platform), then creates a *draft* GitHub release with the bundle, its
# checksum and a build-provenance attestation, so a release is never
# visible without its asset. Nothing here publishes it: the owner runs the
# README's smoke-test checklist on the draft's bundle, records it in the
# release's smoke log, and publishes the draft by hand.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build-macos:
    # Native Apple Silicon build. Read-only, like `build`: it runs every
    # dependency's build script.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      # Test the macOS code on macOS too; the Linux `build` job can't. No
      # rust-cache here: a poisoned PR cache must never reach a release build.
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: scripts/check-macos-bin.sh target/aarch64-apple-darwin/release/opendeck-claude-usage
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release opendeck-claude-usage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build:
    # Read-only: this job runs every dependency's build script and proc
    # macro, so it gets no token that can write anything.
    needs: build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml and manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          manifest_version=$(jq -r .Version assets/manifest.json)
          echo "tag=$tag Cargo.toml=$cargo_version manifest.json=$manifest_version"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$manifest_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) / manifest.json ($manifest_version)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bin
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          test -x target/aarch64-apple-darwin/release/opendeck-claude-usage
      # Nothing here runs the aarch64 binaries; at least check they are ones.
      - name: Check each binary's architecture
        run: |
          file target/x86_64-unknown-linux-gnu/release/opendeck-claude-usage | grep -q 'x86-64'
          file target/aarch64-unknown-linux-gnu/release/opendeck-claude-usage | grep -q 'ARM aarch64'
          # The same regex as scripts/check-macos-bin.sh (which can't run
          # here: it needs a Mac to verify the signature and start the binary).
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b target/aarch64-apple-darwin/release/opendeck-claude-usage | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test tests/pi/*.test.mjs
      # --all: every target in the manifest's CodePaths must be bundled.
      - run: node build.mjs --all
      - name: Zip the plugin bundle and checksum it
        run: |
          cd dist
          zip -r ../opendeck-claude-usage.streamDeckPlugin com.jfms7s.claudeusage.sdPlugin
          cd ..
          unzip -Z opendeck-claude-usage.streamDeckPlugin | grep -E '^-rwx.*opendeck-claude-usage-aarch64-apple-darwin$'
          sha256sum opendeck-claude-usage.streamDeckPlugin > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: |
            opendeck-claude-usage.streamDeckPlugin
            SHA256SUMS
          if-no-files-found: error

  publish:
    # The only job with write access: it runs no project or dependency
    # code, just attests and attaches what `build` produced.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
      - run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: opendeck-claude-usage.streamDeckPlugin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # Left as a draft for the owner's smoke run; never published here.
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            opendeck-claude-usage.streamDeckPlugin
            SHA256SUMS
