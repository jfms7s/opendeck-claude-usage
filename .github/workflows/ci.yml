name: CI
# Switches opendeck-claude-usage to the shared CI. Replaces the in-repo jobs test, aarch64, macos
# and advisories.yml (delete that file: its weekly schedule and the advisory scan live here now;
# scheduled runs only run `audit`). The old msrv job was dropped from master already.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  # Reports the checks as `ci / <job>`: those are the names for the
  # "Protect master" ruleset (see opendeck-plugin-ci's README).
  ci:
    permissions:
      contents: read
      packages: read # the report-only eng-metrics-lab job
    uses: jfms7s/opendeck-plugin-ci/.github/workflows/ci.yml@098bfd0f9d891c2db4f26cd95627e6e6a567563a # v0.1.0
    with:
      # The jobs the ruleset requires: fails if an input above switches one off (skipped counts as green).
      required-jobs: "test macos aarch64 bundle"
      pi-tests: "tests/pi/*.test.mjs"
      aarch64: true
      macos: true
      macos-check: "scripts/check-macos-bin.sh {bin}"
      audit: "cargo-deny"
      deny-checks: "advisories sources"
