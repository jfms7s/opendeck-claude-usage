name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      # Replaces `cargo test`: the same tests, instrumented. The fragment waits in
      # RUNNER_TEMP until every test in the job has passed (see the collect step).
      - name: Test with coverage (eng-metrics-lab)
        run: cargo llvm-cov --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The Property Inspector logic, executed (not grepped).
      - run: node --test tests/pi/*.test.mjs
      # Packaging runs on every PR, so a version mismatch or a missing
      # asset fails here rather than when a release is cut.
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: node build.mjs x86_64-unknown-linux-gnu
      # Only reached when every step above passed, so a red test leaves no fragment.
      - name: Collect coverage fragment (eng-metrics-lab)
        run: |
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-rust.lcov" .quality/coverage-rust.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fragments
          path: .quality/coverage-rust.lcov
          include-hidden-files: true
          retention-days: 7

  msrv:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.88" # keep in sync with rust-version in Cargo.toml
      - run: cargo check --all-targets --locked

  macos:
    # The release ships an Apple Silicon binary: lint, test and package it
    # natively, with the release's signature and start-up checks, so a PR
    # catches them before a tag. fmt and cargo-deny don't depend on the
    # platform.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test tests/pi/*.test.mjs
      - run: cargo build --release --locked
      - name: Check it is a signed arm64 binary that starts
        run: |
          bin=target/release/opendeck-claude-usage
          file "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
          # Apple Silicon kills unsigned binaries; the linker's ad-hoc
          # signature must survive `strip = true`.
          codesign --verify --verbose "$bin"
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$("$bin" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - run: node build.mjs aarch64-apple-darwin

  # The same MSRV check on macOS, as its own job: the master ruleset requires
  # a check named exactly `msrv`, which a matrix would rename.
  msrv-macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: "1.88" # keep in sync with rust-version in Cargo.toml
      - run: cargo check --all-targets --locked

  advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # eng-metrics-lab (report-only): duplication, complexity and dead code; the collector picks up the artifact.
  quality:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
