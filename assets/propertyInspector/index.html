<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style>
		body { font: 12px system-ui, sans-serif; margin: 0; padding: 8px 12px; }
		label { display: block; margin-top: 10px; font-size: 11px; opacity: 0.8; }
		select, input { width: 100%; box-sizing: border-box; margin-top: 2px; }
		details { margin-top: 12px; }
		summary { cursor: pointer; font-size: 11px; opacity: 0.8; }
		.hint { font-size: 10px; opacity: 0.6; }
		button { margin-top: 8px; }
		.check { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; opacity: 1; }
		.check input { width: auto; margin: 0; }
	</style>
</head>
<body>
	<label for="window">Window</label>
	<select id="window">
		<option value="session">Session (5 hour)</option>
		<option value="weekly">Weekly (7 day)</option>
		<option value="monthly">Monthly (extra usage)</option>
	</select>

	<label>Cycle styles</label>
	<div id="cycleStyles">
		<label class="check"><input type="checkbox" value="speedometer" /> Speedometer</label>
		<label class="check"><input type="checkbox" value="bar" /> Bar</label>
		<label class="check"><input type="checkbox" value="softPill" /> Soft pill</label>
		<label class="check"><input type="checkbox" value="openDonut" /> Open donut</label>
		<label class="check"><input type="checkbox" value="trackedDonut" /> Tracked donut</label>
		<label class="check"><input type="checkbox" value="thinRing" /> Thin ring</label>
	</div>
	<p class="hint">Short press cycles the checked styles (need at least two). Hold to refresh.</p>

	<div id="colors"></div>
	<script src="colors.js"></script>

	<script>
		window.connectOpenActionSocketData = new Promise((resolve) => {
			window.connectOpenActionSocket = (...args) => resolve(args);
			window.connectElgatoStreamDeckSocket = window.connectOpenActionSocket;
		});

		let websocket;
		let uuid;
		let storedStyle;

		const styleBoxes = () => [...document.querySelectorAll("#cycleStyles input")];
		styleBoxes().forEach((box) => box.addEventListener("change", sendSettings));

		mountColorSection(document.getElementById("colors"), { showMode: true, onChange: sendSettings });

		window.connectOpenActionSocketData.then(([inPort, inUUID, inRegisterEvent, inInfo, inActionInfo]) => {
			uuid = inUUID;
			const actionInfo = JSON.parse(inActionInfo);
			websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);

			websocket.onopen = () => {
				websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
				applySettings(actionInfo.payload.settings || {});
			};

			websocket.onmessage = (event) => {
				const message = JSON.parse(event.data);
				if (message.event === "didReceiveSettings") {
					const settings = message.payload.settings || {};
					if (pendingSave) {
						// The reply to our getSettings: only the pass-through
						// value is refreshed, so the edit being saved is kept.
						storedStyle = settings.style;
						saveSettings();
					} else {
						applySettings(settings);
					}
				}
			};
		});

		function applySettings(settings) {
			document.getElementById("window").value = settings.window || "session";
			applyColorSettings(settings);
			storedStyle = settings.style;
			// Mirrors the plugin: no list yet means all ticked; an explicit
			// (even empty) list is shown as saved.
			const cycle = Array.isArray(settings.cycleStyles)
				? settings.cycleStyles
				: styleBoxes().map((box) => box.value);
			styleBoxes().forEach((box) => { box.checked = cycle.includes(box.value); });
		}

		// OpenDeck may not forward the plugin's own setSettings (a press
		// changing the gauge style) to an open PI, so the gauge style held here can be
		// stale. Re-read the stored settings before saving; if no reply
		// comes, save with what we have.
		let pendingSave = null;

		function sendSettings() {
			if (pendingSave) return; // the pending save reads the form when it sends
			pendingSave = setTimeout(saveSettings, 500);
			websocket.send(JSON.stringify({ event: "getSettings", context: uuid }));
		}

		function saveSettings() {
			clearTimeout(pendingSave);
			pendingSave = null;
			websocket.send(JSON.stringify({
				event: "setSettings",
				context: uuid,
				payload: {
					window: document.getElementById("window").value,
					...readColorSettings(),
					// The current style changes only by pressing the key; pass
					// it through untouched so saving here doesn't reset it.
					...(storedStyle ? { style: storedStyle } : {}),
					cycleStyles: styleBoxes().filter((box) => box.checked).map((box) => box.value),
				},
			}));
		}

		document.getElementById("window").addEventListener("change", sendSettings);
	</script>
</body>
</html>
