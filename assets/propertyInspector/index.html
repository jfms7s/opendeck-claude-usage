<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#colors { display: contents; }
		.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Display</h2>
			<div class="field">
				<label for="window">Window</label>
				<select id="window">
					<option value="session">Session (5 hour)</option>
					<option value="weekly">Weekly (7 day)</option>
					<option value="monthly">Monthly (extra usage)</option>
				</select>
			</div>
		</section>

		<section class="card">
			<h2>Cycle styles</h2>
			<div class="checks" id="cycleStyles">
				<label class="check"><input type="checkbox" value="speedometer" /> Speedometer</label>
				<label class="check"><input type="checkbox" value="bar" /> Bar</label>
				<label class="check"><input type="checkbox" value="softPill" /> Soft pill</label>
				<label class="check"><input type="checkbox" value="openDonut" /> Open donut</label>
				<label class="check"><input type="checkbox" value="trackedDonut" /> Tracked donut</label>
				<label class="check"><input type="checkbox" value="thinRing" /> Thin ring</label>
			</div>
			<p class="hint">Short press cycles the checked styles (need at least two). Hold to refresh.</p>
		</section>

		<div id="colors"></div>
	</main>
	<script src="pi-common.js"></script>
	<script src="colors.js"></script>

	<script>
		const styleBoxes = () => [...document.querySelectorAll("#cycleStyles input")];

		const pi = connectPI({
			apply(settings) {
				selectKnown(document.getElementById("window"), settings.window, "session");
				applyColorSettings(settings);
				// Mirrors the plugin: no list yet means all ticked; an explicit
				// (even empty) list is shown as saved.
				const cycle = Array.isArray(settings.cycleStyles)
					? settings.cycleStyles
					: styleBoxes().map((box) => box.value);
				styleBoxes().forEach((box) => { box.checked = cycle.includes(box.value); });
			},
			read: () => ({
				window: document.getElementById("window").value,
				...readColorSettings(),
				cycleStyles: styleBoxes().filter((box) => box.checked).map((box) => box.value),
			}),
			// The current style changes only by pressing the key.
			passThrough: ["style"],
		});

		mountColorSection(document.getElementById("colors"), { showMode: true, onChange: pi.changed });
		styleBoxes().forEach((box) => box.addEventListener("change", pi.changed));
		document.getElementById("window").addEventListener("change", pi.changed);
	</script>
</body>
</html>
