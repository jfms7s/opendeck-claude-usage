<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#colors { display: contents; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Controls</h2>
			<p class="hint">Short press flips between horizontal and vertical. Hold to refresh.</p>
		</section>

		<div id="colors"></div>
	</main>
	<script src="pi-common.js"></script>
	<script src="colors.js"></script>

	<script>
		const pi = connectPI({
			apply: applyColorSettings,
			read: () => ({ ...readColorSettings() }),
			// The layout changes only by pressing the key.
			passThrough: ["layout"],
		});

		mountColorSection(document.getElementById("colors"), { showMode: true, onChange: pi.changed });
	</script>
</body>
</html>
