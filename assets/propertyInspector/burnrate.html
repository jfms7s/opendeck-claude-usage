<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#colors { display: contents; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Display</h2>
			<div class="field">
				<label for="window">Window</label>
				<select id="window">
					<option value="session">Session (5 hour)</option>
					<option value="weekly">Weekly (7 day)</option>
				</select>
			</div>
			<div class="field">
				<label for="metric">Show</label>
				<select id="metric">
					<option value="pace">Pace (% per hour / per day)</option>
					<option value="evenBurn">Even burn (1.0x = on track)</option>
					<option value="runway">Runway (time until empty)</option>
				</select>
				<p class="hint">Colors always follow pace: a fast burn warns before usage itself crosses a mark.</p>
			</div>
		</section>

		<div id="colors"></div>
	</main>
	<script src="pi-common.js"></script>
	<script src="colors.js"></script>

	<script>
		const pi = connectPI({
			apply(settings) {
				selectKnown(document.getElementById("window"), settings.window, "session");
				selectKnown(document.getElementById("metric"), settings.metric, "pace");
				applyColorSettings(settings);
			},
			read: () => ({
				window: document.getElementById("window").value,
				metric: document.getElementById("metric").value,
				...readColorSettings(),
			}),
		});

		mountColorSection(document.getElementById("colors"), { showMode: false, onChange: pi.changed });
		document.getElementById("window").addEventListener("change", pi.changed);
		document.getElementById("metric").addEventListener("change", pi.changed);
	</script>
</body>
</html>
