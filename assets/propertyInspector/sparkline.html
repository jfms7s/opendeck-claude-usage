<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#colors { display: contents; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Display</h2>
			<div class="field">
				<label for="window">Window</label>
				<select id="window">
					<option value="session">Session (5 hour)</option>
					<option value="weekly">Weekly (7 day)</option>
				</select>
				<p class="hint">History builds up as the plugin runs and is kept for 8 days.</p>
			</div>
			<p class="hint">Short press (key or dial) switches between Trend and Today. Hold to refresh.</p>
		</section>

		<div id="colors"></div>
	</main>
	<script src="pi-common.js"></script>
	<script src="colors.js"></script>

	<script>
		const pi = connectPI({
			apply(settings) {
				selectKnown(document.getElementById("window"), settings.window, "session");
				applyColorSettings(settings);
			},
			read: () => ({
				window: document.getElementById("window").value,
				...readColorSettings(),
			}),
			// The series changes only by pressing.
			passThrough: ["series"],
		});

		mountColorSection(document.getElementById("colors"), { onChange: pi.changed });
		document.getElementById("window").addEventListener("change", pi.changed);
	</script>
</body>
</html>
