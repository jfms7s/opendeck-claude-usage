<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Display</h2>
			<div class="row">
				<div class="field">
					<label for="metric">Metric</label>
					<select id="metric">
						<option value="tokens">Tokens</option>
						<option value="cost">Cost</option>
					</select>
				</div>
				<div class="field">
					<label for="range">Range</label>
					<select id="range">
						<option value="today">Today</option>
						<option value="sevenday">7 days</option>
						<option value="session">Session (5 hour)</option>
					</select>
				</div>
			</div>
		</section>

		<section class="card">
			<h2>Updates</h2>
			<div class="field">
				<label for="refresh_seconds">Refresh every</label>
				<input type="number" id="refresh_seconds" min="5" max="3600" step="1" />
				<p class="hint">Seconds (5 to 3600).</p>
			</div>
		</section>
	</main>
	<script src="pi-common.js"></script>

	<script>
		const pi = connectPI({
			apply(settings) {
				selectKnown(document.getElementById("metric"), settings.metric, "tokens");
				selectKnown(document.getElementById("range"), settings.range, "today");
				const seconds = Number(settings.refresh_seconds);
				document.getElementById("refresh_seconds").value = Number.isInteger(seconds) && seconds > 0 ? seconds : 60;
			},
			read: () => ({
				metric: document.getElementById("metric").value,
				range: document.getElementById("range").value,
				refresh_seconds: Math.min(3600, Math.max(5, parseInt(document.getElementById("refresh_seconds").value, 10) || 60)),
			}),
		});

		for (const id of ["metric", "range", "refresh_seconds"]) {
			document.getElementById(id).addEventListener("change", pi.changed);
		}
	</script>
</body>
</html>
