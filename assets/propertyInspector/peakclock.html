<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		.days { display: flex; flex-wrap: wrap; gap: 8px 14px; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Peak hours</h2>
			<div class="row">
				<div class="field">
					<label for="peak_start">Starts at</label>
					<input type="time" id="peak_start" />
				</div>
				<div class="field">
					<label for="peak_end">Ends at</label>
					<input type="time" id="peak_end" />
				</div>
			</div>
		</section>

		<section class="card">
			<h2>Peak applies on</h2>
			<div class="days" id="peak_days" role="group" aria-label="Peak applies on">
				<label class="check"><input type="checkbox" value="mon" /> Mon</label>
				<label class="check"><input type="checkbox" value="tue" /> Tue</label>
				<label class="check"><input type="checkbox" value="wed" /> Wed</label>
				<label class="check"><input type="checkbox" value="thu" /> Thu</label>
				<label class="check"><input type="checkbox" value="fri" /> Fri</label>
				<label class="check"><input type="checkbox" value="sat" /> Sat</label>
				<label class="check"><input type="checkbox" value="sun" /> Sun</label>
			</div>
		</section>
	</main>
	<script src="pi-common.js"></script>

	<script>
		const DEFAULT_PEAK_DAYS = ["mon", "tue", "wed", "thu", "fri"];
		const dayBoxes = document.querySelectorAll("#peak_days input");
		const isTime = (value) => typeof value === "string" && /^\d{2}:\d{2}$/.test(value);

		const pi = connectPI({
			apply(settings) {
				document.getElementById("peak_start").value = isTime(settings.peak_start) ? settings.peak_start : "13:00";
				document.getElementById("peak_end").value = isTime(settings.peak_end) ? settings.peak_end : "18:00";
				// Only a missing key falls back to weekdays - an empty list means
				// the user unticked every day.
				const days = Array.isArray(settings.peak_days) ? settings.peak_days : DEFAULT_PEAK_DAYS;
				dayBoxes.forEach((box) => { box.checked = days.includes(box.value); });
			},
			read: () => ({
				peak_start: document.getElementById("peak_start").value,
				peak_end: document.getElementById("peak_end").value,
				peak_days: Array.from(dayBoxes).filter((box) => box.checked).map((box) => box.value),
			}),
		});

		document.getElementById("peak_start").addEventListener("change", pi.changed);
		document.getElementById("peak_end").addEventListener("change", pi.changed);
		dayBoxes.forEach((box) => box.addEventListener("change", pi.changed));
	</script>
</body>
</html>
