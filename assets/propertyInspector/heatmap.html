<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style>
		body { font: 12px system-ui, sans-serif; margin: 0; padding: 8px 12px; }
		label { display: block; margin-top: 10px; font-size: 11px; opacity: 0.8; }
		select, input { width: 100%; box-sizing: border-box; margin-top: 2px; }
		.hint { font-size: 10px; opacity: 0.6; }
	</style>
</head>
<body>
	<label for="metric">Measure</label>
	<select id="metric">
		<option value="tokens">Tokens</option>
		<option value="cost">Cost (estimated)</option>
	</select>

	<label for="color">Color</label>
	<input type="color" id="color" />

	<p class="hint">Short press flips between 7 days and 4 weeks. Hold to refresh.</p>

	<script>
		const DEFAULT_COLOR = "#d97757";

		window.connectOpenActionSocketData = new Promise((resolve) => {
			window.connectOpenActionSocket = (...args) => resolve(args);
			window.connectElgatoStreamDeckSocket = window.connectOpenActionSocket;
		});

		let websocket;
		let uuid;
		let storedView;

		window.connectOpenActionSocketData.then(([inPort, inUUID, inRegisterEvent, inInfo, inActionInfo]) => {
			uuid = inUUID;
			const actionInfo = JSON.parse(inActionInfo);
			websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);

			websocket.onopen = () => {
				websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
				applySettings(actionInfo.payload.settings || {});
			};

			websocket.onmessage = (event) => {
				const message = JSON.parse(event.data);
				if (message.event === "didReceiveSettings") {
					applySettings(message.payload.settings || {});
				}
			};
		});

		function applySettings(settings) {
			storedView = settings.view;
			document.getElementById("metric").value = settings.metric === "cost" ? "cost" : "tokens";
			document.getElementById("color").value = /^#[0-9a-f]{6}$/i.test(settings.color || "")
				? settings.color
				: DEFAULT_COLOR;
		}

		function sendSettings() {
			websocket.send(JSON.stringify({
				event: "setSettings",
				context: uuid,
				payload: {
					metric: document.getElementById("metric").value,
					color: document.getElementById("color").value,
					// The view changes only by pressing the key; pass it
					// through untouched so saving here doesn't reset it.
					...(storedView ? { view: storedView } : {}),
				},
			}));
		}

		document.getElementById("metric").addEventListener("change", sendSettings);
		document.getElementById("color").addEventListener("change", sendSettings);
	</script>
</body>
</html>
