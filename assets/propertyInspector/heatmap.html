<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Display</h2>
			<div class="row">
				<div class="field">
					<label for="metric">Measure</label>
					<select id="metric">
						<option value="tokens">Tokens</option>
						<option value="cost">Cost (estimated)</option>
					</select>
				</div>
				<div class="field">
					<label for="scope">Scope</label>
					<select id="scope">
						<option value="all">All usage</option>
						<option value="opus">Opus</option>
						<option value="sonnet">Sonnet</option>
						<option value="haiku">Haiku</option>
					</select>
				</div>
				<div class="field narrow">
					<label for="color">Color</label>
					<input type="color" id="color" />
				</div>
			</div>
			<p class="hint">Short press (key or dial) flips between 7 days and 4 weeks. Hold to refresh.</p>
		</section>
	</main>
	<script src="pi-common.js"></script>

	<script>
		const DEFAULT_COLOR = "#d97757";

		// The plugin's project list, once it arrives.
		let projects = [];

		const pi = connectPI({
			onPluginMessage(payload) {
				if (!Array.isArray(payload.projects)) return;
				projects = payload.projects;
				const scope = document.getElementById("scope");
				setProjectOptions(scope, projects, scope.value);
			},
			apply(settings) {
				selectKnown(document.getElementById("metric"), settings.metric, "tokens");
				setProjectOptions(document.getElementById("scope"), projects, settings.scope);
				document.getElementById("color").value = isHexColor(settings.color)
					? settings.color.toLowerCase()
					: DEFAULT_COLOR;
			},
			read: () => ({
				metric: document.getElementById("metric").value,
				scope: document.getElementById("scope").value,
				color: document.getElementById("color").value,
			}),
			// The view changes only by pressing the key.
			passThrough: ["view"],
		});

		document.getElementById("metric").addEventListener("change", pi.changed);
		document.getElementById("scope").addEventListener("change", pi.changed);
		document.getElementById("color").addEventListener("change", pi.changed);
	</script>
</body>
</html>
